
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Raj House</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="site-header">
    <a href="index.html" class="logo">RAJ HOUSE</a>
    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#products">Shop</a>
        <a href="cart.html">Cart</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<main class="auth-page">
    <div class="auth-card">
        <h1>Create Account</h1>
        <p class="auth-subtitle">Join the Raj House family</p>

        <form id="register-form">

            <div class="form-group">
                <label for="register-name">Full Name</label>
                <input type="text" id="register-name"
                       placeholder="Enter your full name"
                       minlength="3" required>
            </div>

            <div class="form-group">
                <label for="register-email">Email Address</label>
                <input type="email" id="register-email"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="register-password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="register-password"
                           placeholder="Create a password"
                           minlength="8" required>
                    <button type="button" class="password-toggle"
                            data-target="register-password">Show</button>
                </div>
                <small>Use at least 8 characters.</small>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirm-password"
                           placeholder="Confirm your password" required>
                    <button type="button" class="password-toggle"
                            data-target="confirm-password">Show</button>
                </div>
            </div>

            <p id="register-message" class="auth-message"></p>

            <button type="submit" class="auth-submit">
                Create Account
            </button>
        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="login.html">Login</a>
        </p>
    </div>
</main>

<footer class="site-footer">
    <p>&copy; <span id="footer-year"></span> Raj House. All rights reserved.</p>
</footer>

<script src="js/auth.js"></script>
</body>
</html>
